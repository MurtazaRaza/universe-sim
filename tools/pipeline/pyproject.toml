[project]
name = "usim-pipeline"
version = "0.1.0"
description = "Data pipeline of the Universe Simulation: fetch and verify sources, build data packs, generate reference data."
requires-python = ">=3.12"
# Exact pins, with hashes, are in requirements.txt (generated by pin_requirements.py).
dependencies = ["spiceypy==8.2.0", "numpy==2.5.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
